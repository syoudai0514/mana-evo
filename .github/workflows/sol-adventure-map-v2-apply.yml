name: Apply adventure map v2

on:
  push:
    branches:
      - sol/adventure-map-zones

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/adventure-map-zones
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply adventure map v2
        run: python scripts/apply-adventure-map-v2.py
      - name: Install dependencies
        run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sol-adventure-map-v2-apply.yml
          git rm scripts/apply-adventure-map-v2.py
          git add -A
          git commit -m "feat: turn adventure list into zone exploration"
          git push origin HEAD:sol/adventure-map-zones
