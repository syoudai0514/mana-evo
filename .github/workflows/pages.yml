name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Build for GitHub Pages
        run: npm run build
        env:
          VITE_BASE_PATH: /mana-evo/
      - name: Validate PWA artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          grep -q '/mana-evo/manifest.webmanifest' dist/index.html
          grep -q '/mana-evo/icons/icon-192.png' dist/index.html
          grep -q 'rel="apple-touch-icon"' dist/index.html
          node - <<'NODE'
          const fs = require('fs')
          const manifest = JSON.parse(fs.readFileSync('dist/manifest.webmanifest', 'utf8'))
          const html = fs.readFileSync('dist/index.html', 'utf8')
          for (const key of ['id', 'start_url', 'scope']) {
            if (manifest[key] !== '/mana-evo/') throw new Error(`${key} must be /mana-evo/`)
          }
          if (!html.includes('rel="apple-touch-icon"') || !html.includes('/mana-evo/icons/icon-192.png')) {
            throw new Error('apple-touch-icon must reference the shipped 192px icon')
          }
          for (const [file, size] of [['dist/icons/icon-192.png', 192], ['dist/icons/icon-512.png', 512]]) {
            const png = fs.readFileSync(file)
            if (png.toString('hex', 0, 8) !== '89504e470d0a1a0a') throw new Error(`${file} is not PNG`)
            if (png.readUInt32BE(16) !== size || png.readUInt32BE(20) !== size) {
              throw new Error(`${file} must be ${size}x${size}`)
            }
          }
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
