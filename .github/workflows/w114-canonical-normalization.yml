name: W-114 canonical shard regeneration

on:
  push:
    branches:
      - rebuild/w-114-canonical-normalization
    paths:
      - .github/workflows/w114-canonical-normalization.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/w-114-canonical-normalization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate and validate canonical shards
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='design/baseline/FINAL-CORRECTED/source/scripts/families.mjs'
          test "$(git hash-object "$BASELINE")" = 'fb8ff51ac55381534cfbf037f63993ccf0308c23'
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { FAMILIES } from './design/baseline/FINAL-CORRECTED/source/scripts/families.mjs';

          const keys = [
            'no','speciesId','name','familyNo','stage','type','motif','familyConcept',
            'personalityArc','personalityArcContext','description','graphicCore',
            'expressionAndPose','silhouette'
          ];

          let no = 0;
          const baselineRecords = FAMILIES.flatMap((f, familyIndex) =>
            f.members.map((m, idx) => {
              no += 1;
              const last = f.members.length - 1;
              return {
                no,
                speciesId: `m${String(no).padStart(3, '0')}`,
                name: m.name,
                familyNo: familyIndex + 1,
                stage: idx + 1,
                type: f.type,
                motif: f.motif,
                familyConcept: f.concept,
                personalityArc: f.arc,
                personalityArcContext: idx === 0
                  ? (f.arc?.初期 ?? null)
                  : idx === last
                    ? (f.arc?.最終 ?? null)
                    : (f.arc?.中間 ?? null),
                description: m.desc,
                graphicCore: `${f.motif}を一目で識別できる主役モチーフにする。最終形は「${f.arc?.最終 ?? f.members.at(-1)?.desc ?? f.concept}」がシルエットで伝わる。`,
                expressionAndPose: idx === 0
                  ? `幼く、${f.arc?.初期 ?? '未熟さ'}が伝わる表情。大きめの頭と読みやすい姿勢。`
                  : idx === last
                    ? `落ち着いた自信。${f.arc?.最終 ?? '完成された役割'}が一目で分かる堂々とした姿勢。`
                    : `幼さを少し残しつつ、${f.arc?.中間 ?? '成長'}を象徴部位と姿勢に出す。`,
                silhouette: idx === 0
                  ? '丸みを多めにし、象徴部位は1つを強く見せる。'
                  : idx === last
                    ? '象徴部位を最大化し、遠目でも系列と役割が分かる完成シルエット。'
                    : '第1形の識別点を残し、体格/翼/角/葉/毛/武器的部位などを1段階発達させる。'
              };
            })
          );

          if (FAMILIES.length !== 84) throw new Error(`baseline family count ${FAMILIES.length}`);
          if (baselineRecords.length !== 239) throw new Error(`baseline record count ${baselineRecords.length}`);
          if (baselineRecords[238].speciesId !== 'm239') throw new Error('baseline m239 missing');

          const active = baselineRecords.slice(0, 238);
          const expectedIds = Array.from({length: 238}, (_, i) => `m${String(i + 1).padStart(3, '0')}`);
          const ids = active.map(r => r.speciesId);
          if (active.length !== 238) throw new Error('active count');
          if (new Set(ids).size !== 238) throw new Error('duplicate speciesId');
          if (JSON.stringify(ids) !== JSON.stringify(expectedIds)) throw new Error('gap/order');
          if (active.some(r => r.speciesId === 'm239')) throw new Error('m239 present');
          if (active.find(r => r.speciesId === 'm236')?.name !== 'ホシラディア') throw new Error('m236 mismatch');
          for (const r of active) {
            if (JSON.stringify(Object.keys(r)) !== JSON.stringify(keys)) {
              throw new Error(`schema mismatch ${r.speciesId}: ${Object.keys(r).join(',')}`);
            }
          }

          const shards = [active.slice(0, 80), active.slice(80, 160), active.slice(160, 238)];
          if (shards[0].length !== 80 || shards[1].length !== 80 || shards[2].length !== 78) throw new Error('shard counts');
          const paths = [
            'design/current/monsters/descriptions-001-080.json',
            'design/current/monsters/descriptions-081-160.json',
            'design/current/monsters/descriptions-161-238.json'
          ];
          shards.forEach((rows, i) => fs.writeFileSync(paths[i], JSON.stringify(rows) + '\n'));

          // Lossless proof: every active record is a pure projection of the immutable baseline.
          let cursor = 0;
          for (let fi = 0; fi < FAMILIES.length && cursor < 238; fi++) {
            const f = FAMILIES[fi];
            for (let idx = 0; idx < f.members.length && cursor < 238; idx++, cursor++) {
              const r = active[cursor];
              const m = f.members[idx];
              const last = f.members.length - 1;
              const expected = {
                no: cursor + 1,
                speciesId: `m${String(cursor + 1).padStart(3, '0')}`,
                name: m.name,
                familyNo: fi + 1,
                stage: idx + 1,
                type: f.type,
                motif: f.motif,
                familyConcept: f.concept,
                personalityArc: f.arc,
                personalityArcContext: idx === 0 ? (f.arc?.初期 ?? null) : idx === last ? (f.arc?.最終 ?? null) : (f.arc?.中間 ?? null),
                description: m.desc,
                graphicCore: `${f.motif}を一目で識別できる主役モチーフにする。最終形は「${f.arc?.最終 ?? f.members.at(-1)?.desc ?? f.concept}」がシルエットで伝わる。`,
                expressionAndPose: idx === 0 ? `幼く、${f.arc?.初期 ?? '未熟さ'}が伝わる表情。大きめの頭と読みやすい姿勢。` : idx === last ? `落ち着いた自信。${f.arc?.最終 ?? '完成された役割'}が一目で分かる堂々とした姿勢。` : `幼さを少し残しつつ、${f.arc?.中間 ?? '成長'}を象徴部位と姿勢に出す。`,
                silhouette: idx === 0 ? '丸みを多めにし、象徴部位は1つを強く見せる。' : idx === last ? '象徴部位を最大化し、遠目でも系列と役割が分かる完成シルエット。' : '第1形の識別点を残し、体格/翼/角/葉/毛/武器的部位などを1段階発達させる。'
              };
              if (JSON.stringify(r) !== JSON.stringify(expected)) throw new Error(`baseline drift ${r.speciesId}`);
            }
          }
          if (cursor !== 238) throw new Error(`lossless cursor ${cursor}`);
          console.log('W-114 validation PASS: 238 records; shards 80/80/78; gaps 0; duplicates 0; schema exact; m239 absent; m236=ホシラディア; baseline loss/invention 0');
          NODE

          test "$(git hash-object design/current/monsters/descriptions-001-080.json)" = '0063607c0eb1d67274f0cbc606b4e489b83f6773'
          test "$(git hash-object design/current/monsters/descriptions-081-160.json)" = '270a875c8e4c98162219c44b8fce4b5a442c4b2f'
          test "$(git hash-object design/current/monsters/descriptions-161-238.json)" = 'a801a6cdd4e097f65c36add2274264dce8cfd342'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/current/monsters/descriptions-001-080.json \
                  design/current/monsters/descriptions-081-160.json \
                  design/current/monsters/descriptions-161-238.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --name-only | grep -Fx 'design/current/monsters/descriptions-001-080.json'
          git diff --cached --name-only | grep -Fx 'design/current/monsters/descriptions-081-160.json'
          git diff --cached --name-only | grep -Fx 'design/current/monsters/descriptions-161-238.json'
          git commit -m 'W-114 normalize monster description shards'
          git push origin HEAD:rebuild/w-114-canonical-normalization
