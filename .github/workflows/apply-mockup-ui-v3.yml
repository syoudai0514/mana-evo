name: Apply approved mockup UI v3

on:
  push:
    branches:
      - sol/mockup-ui-v3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/mockup-ui-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Repair applicator templates
        run: node scripts/repair-mockup-ui-applicator.mjs
      - name: Apply approved mockup UI
        run: node scripts/apply-mockup-ui-v3.mjs
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit implementation only
        run: |
          rm -f scripts/apply-mockup-ui-v3.mjs scripts/repair-mockup-ui-applicator.mjs .github/workflows/apply-mockup-ui-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement approved ManaEvo mockup UI" || exit 0
          git push origin HEAD:sol/mockup-ui-v3
