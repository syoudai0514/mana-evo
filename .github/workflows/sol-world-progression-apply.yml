name: Apply world progression redesign

on:
  push:
    branches:
      - sol/world-map-evolution-progression

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/world-map-evolution-progression
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply approved design
        run: python scripts/apply-world-progression.py
      - name: Install dependencies
        run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sol-world-progression-apply.yml
          git rm scripts/apply-world-progression.py
          git add -A
          git commit -m "feat: restore world progression and evolution-first encounters"
          git push origin HEAD:sol/world-map-evolution-progression
