name: Review Package

on:
  push:
    branches:
      - review/mana-evo-20260822
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build tracked-source review directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-package
          while IFS= read -r -d '' file; do
            mkdir -p "review-package/$(dirname "$file")"
            cp "$file" "review-package/$file"
          done < <(git ls-files -z)
          cat > review-package/PACKAGE-METADATA.txt <<EOF
          Package: Mana Evo source + unresolved decisions review package
          Review source PR: #3
          Original implementation HEAD: 1281287a64b36f897e617da72fd2b152155fdc6b
          CI for original implementation: SUCCESS (run 32575588653)
          Review package branch: $GITHUB_HEAD_REF
          Review package commit: $GITHUB_SHA
          Generated UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: mana-evo-review-source-unresolved-20260822
          path: review-package/
          if-no-files-found: error
          retention-days: 14
