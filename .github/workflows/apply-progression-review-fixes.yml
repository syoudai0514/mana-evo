name: Apply progression review fixes

on:
  push:
    branches:
      - sol/progression-review-fixes
    paths:
      - scripts/apply-progression-review-fixes.mjs
      - .github/workflows/apply-progression-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/progression-review-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply reviewed fixes
        run: node scripts/apply-progression-review-fixes.mjs
      - name: Install dependencies
        run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit reviewed implementation
        run: |
          rm scripts/apply-progression-review-fixes.mjs .github/workflows/apply-progression-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align progression rewards with world design"
          git push origin HEAD:sol/progression-review-fixes
