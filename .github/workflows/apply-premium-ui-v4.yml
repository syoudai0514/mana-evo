name: Apply Premium UI v4

on:
  push:
    branches:
      - sol/premium-ui-v4

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/premium-ui-v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply premium UI patch
        run: python scripts/apply_premium_ui_v4.py
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified implementation only
        run: |
          rm -f scripts/apply_premium_ui_v4.py .github/workflows/apply-premium-ui-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: raise ManaEvo UI to premium mockup quality"
          git push origin HEAD:sol/premium-ui-v4
