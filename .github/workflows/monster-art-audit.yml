name: Monster Art Visual Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'public/monsters/**'
      - 'design/rebuild/asset-production/candidate-provenance/**'
      - 'design/rebuild/asset-production/candidate-history/**'
      - 'scripts/monster-art/final-closeout-n1a.py'
      - '.github/workflows/monster-art-audit.yml'
      - 'src/game/**'
      - 'public/sw.js'

jobs:
  n1a:
    if: github.actor != 'github-actions[bot]' && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'normalize/final-closeout-scale'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Gate one-shot setup commit
        id: gate
        shell: bash
        run: |
          subject="$(git log -1 --pretty=%s)"
          if [ "$subject" = "chore: run N1A normalization worker" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skip: head subject is $subject"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          npm ci
          python3 -m pip install --disable-pip-version-check pillow

      - name: Snapshot CURRENT candidate state
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          out={}
          for p in sorted(Path("public/monsters").glob("m*.webp")):
              out[p.stem]=hashlib.sha256(p.read_bytes()).hexdigest()
          Path("/tmp/n1a-candidates-before.json").write_text(json.dumps(out, indent=2)+"\n")
          print("candidate count", len(out))
          print("m160", out.get("m160"))
          print("m161", out.get("m161"))
          print("m162", out.get("m162"))
          print("m235", out.get("m235"))
          PY

      - name: CP1 normalize m160 m161
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/monster-art/final-closeout-n1a.py cp1

      - name: CP1 registry and commit
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          node scripts/monster-art/generate-candidate-index.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/monsters/m160.webp public/monsters/m161.webp \
            design/rebuild/asset-production/candidate-provenance/m160.json \
            design/rebuild/asset-production/candidate-provenance/m161.json \
            design/rebuild/asset-production/candidate-history/m160 \
            design/rebuild/asset-production/candidate-history/m161 \
            src/game/candidateArt.generated.js
          git commit -m 'normalize: final closeout N1A CP1 m160 m161'
          echo "CP1_HEAD=$(git rev-parse HEAD)" | tee -a "$GITHUB_ENV"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: CP2 normalize m162
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/monster-art/final-closeout-n1a.py cp2

      - name: CP2 generate runtime and commit
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          npm run generate:runtime
          npm run generate:pwa-assets
          git add \
            public/monsters/m162.webp \
            design/rebuild/asset-production/candidate-provenance/m162.json \
            design/rebuild/asset-production/candidate-history/m162 \
            src/game public/sw.js
          git commit -m 'normalize: final closeout N1A CP2 m162'
          echo "CP2_HEAD=$(git rev-parse HEAD)" | tee -a "$GITHUB_ENV"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Final pixel and hard diff gate
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/monster-art/final-closeout-n1a.py validate

      - name: Registry 238/238
        if: steps.gate.outputs.run == 'true'
        run: node scripts/monster-art/generate-candidate-index.mjs

      - name: CURRENT test suite
        if: steps.gate.outputs.run == 'true'
        run: npm test

      - name: Direct Vite production build
        if: steps.gate.outputs.run == 'true'
        run: npx vite build

      - name: Clean working tree gate
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Report checkpoint heads
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          echo "CP1_HEAD=$CP1_HEAD"
          echo "CP2_HEAD=$CP2_HEAD"
          cat /tmp/n1a-report.json

      - name: Upload N1A QA report
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: final-closeout-n1a-report
          path: /tmp/n1a-report.json
          if-no-files-found: error
