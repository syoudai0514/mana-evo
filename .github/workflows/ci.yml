name: CI

on:
  push:
    branches: [main, 'terra/**', 'rebuild/**']
  pull_request:
    branches: [main, rebuild/canonical-governance]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Verify Monster Art PR exact scope
        if: github.event_name == 'pull_request'
        run: npm run verify:monster-art-scope
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Release readiness artifact
        run: npm run verify:release
      - name: Install WebKit browser
        run: npx playwright install --with-deps webkit
      - name: Monster Art real WebKit decode integration
        run: npm run test:monster-art-webkit
      - name: iPhone WebKit E2E
        run: npm run test:e2e
