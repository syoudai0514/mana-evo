<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>マナエボへ もどります</title>
    <script>
      (() => {
        const APP_ROOT = '/'
        if (window.location.pathname !== APP_ROOT) {
          window.location.replace(`${APP_ROOT}${window.location.search}${window.location.hash}`)
        }
      })()
    </script>
  </head>
  <body>
    <p><a href="/">マナエボへ もどる</a></p>
  </body>
</html>
